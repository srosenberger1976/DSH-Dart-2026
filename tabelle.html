<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSH Bullshooter Liga – Tabelle & Rangliste</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #2a2a2a;
      border: 2px solid #ffcc00;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #ffcc00;
      margin-top: 0;
      border-bottom: 2px solid #ffcc00;
      padding-bottom: 10px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .liga-btn {
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .liga-btn.active {
      background: #ffcc00;
      color: #000;
      border-color: #ffcc00;
    }
    .panel {
      background: #333;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      margin-bottom: 25px;
      overflow-x: auto;
    }
    h2 {
      color: #ffcc00;
      margin-top: 0;
      font-size: 18px;
      border-bottom: 1px solid #555;
      padding-bottom: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #444;
      padding: 9px 6px;
      text-align: center;
    }
    th {
      background: #222;
      color: #ffcc00;
    }
    td.left {
      text-align: left;
      padding-left: 10px;
    }
    tr:nth-child(even) {
      background: #2e2e2e;
    }
    .rank-1 { color: #ffcc00; font-weight: bold; }
    .points-highlight {
      color: #00cc66;
      font-weight: bold;
      font-size: 15px;
    }
    .status-info {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>
    DSH Bullshooter Liga<br>
    <span style="font-size: 16px; color: #fff; font-weight: normal; font-style: italic;">
      Live-Tabelle & Einzelrangliste
    </span>
  </h1>

  <div class="controls">
    <button class="liga-btn active" onclick="waehleLiga('Gruppe A', this)">A-Liga</button>
    <button class="liga-btn" onclick="waehleLiga('Gruppe B', this)">B-Liga</button>
    <button class="liga-btn" onclick="waehleLiga('Gruppe C', this)">C-Liga</button>
  </div>

  <div id="status_text" class="status-info">Lade Spielberichte von GitHub...</div>

  <!-- MANNSCHAFTSTABELLE -->
  <div class="panel">
    <h2>🏆 Mannschaftstabelle (<span id="lbl_current_liga">A-Liga</span>)</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 8%;">Platz</th>
          <th style="text-align: left; padding-left: 10px;">Mannschaft</th>
          <th>Sp.</th>
          <th>S</th>
          <th>U</th>
          <th>N</th>
          <th>Legs</th>
          <th>Diff.</th>
          <th>Punkte</th>
        </tr>
      </thead>
      <tbody id="team_table_body"></tbody>
    </table>
  </div>

  <!-- EINZELRANGLISTE -->
  <div class="panel">
    <h2>🎯 Einzelrangliste – Top-Scorer (<span id="lbl_current_liga_player">A-Liga</span>)</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 8%;">Rang</th>
          <th style="text-align: left; padding-left: 10px;">Spieler</th>
          <th style="text-align: left; padding-left: 10px;">Mannschaft</th>
          <th>Einsätze</th>
          <th>Check (2)</th>
          <th>Assist (1)</th>
          <th>Gesamt</th>
        </tr>
      </thead>
      <tbody id="player_table_body"></tbody>
    </table>
  </div>
</div>

<script>
  // HIER DEINE GITHUB-DATEN EINTRAGEN:
  const GITHUB_USER = "DEIN-GITHUB-NAME";
  const GITHUB_REPO = "DEIN-REPOSITORY-NAME";
  const FOLDER_PATH = "ergebnisse";

  // Punktesystem (anpassbar an eure Liga-Regeln: z.B. 2 Punkte Sieg, 1 Unentschieden)
  const PUNKTE_SIEG = 2;
  const PUNKTE_UNENTSCHIEDEN = 1;
  const PUNKTE_NIEDERLAGE = 0;

  let alleMatches = [];
  let aktuelleLiga = "Gruppe A";

  async function ladeAlleErgebnisse() {
    const statusEl = document.getElementById("status_text");
    const apiUrl = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;

    try {
      const res = await fetch(apiUrl, { cache: "no-store" });
      if (!res.ok) throw new Error("Ordner 'ergebnisse' auf GitHub nicht gefunden.");
      
      const files = await res.json();
      const jsonFiles = files.filter(f => f.name.endsWith(".json"));

      if (jsonFiles.length === 0) {
        statusEl.innerText = "Noch keine JSON-Spielberichte im Ordner 'ergebnisse' vorhanden.";
        return;
      }

      const promises = jsonFiles.map(f => fetch(f.download_url, { cache: "no-store" }).then(r => r.json()));
      alleMatches = await Promise.all(promises);

      statusEl.innerText = `${alleMatches.length} gewertete Spielberichte geladen.`;
      berechneUndZeigeTabellen();
    } catch (err) {
      console.error(err);
      statusEl.innerText = "Hinweis: Bitte trage deinen GitHub-Namen und Repo-Namen im Code ein.";
    }
  }

  function waehleLiga(ligaName, btn) {
    aktuelleLiga = ligaName;
    document.querySelectorAll(".liga-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    
    const anzeige = ligaName.replace("Gruppe ", "") + "-Liga";
    document.getElementById("lbl_current_liga").innerText = anzeige;
    document.getElementById("lbl_current_liga_player").innerText = anzeige;
    
    berechneUndZeigeTabellen();
  }

  function berechneUndZeigeTabellen() {
    const ligaMatches = alleMatches.filter(m => m.liga === aktuelleLiga);
    const teams = {};
    const players = {};

    const initTeam = (name) => {
      if (!teams[name]) {
        teams[name] = { name, spiele: 0, s: 0, u: 0, n: 0, legsPlus: 0, legsMinus: 0, punkte: 0 };
      }
    };

    ligaMatches.forEach(m => {
      initTeam(m.heimTeam);
      initTeam(m.gastTeam);

      const h = teams[m.heimTeam];
      const g = teams[m.gastTeam];

      h.spiele++;
      g.spiele++;
      h.legsPlus += m.legsHeim;
      h.legsMinus += m.legsGast;
      g.legsPlus += m.legsGast;
      g.legsMinus += m.legsHeim;

      if (m.legsHeim > m.legsGast) {
        h.s++; h.punkte += PUNKTE_SIEG;
        g.n++; g.punkte += PUNKTE_NIEDERLAGE;
      } else if (m.legsGast > m.legsHeim) {
        g.s++; g.punkte += PUNKTE_SIEG;
        h.n++; h.punkte += PUNKTE_NIEDERLAGE;
      } else {
        h.u++; h.punkte += PUNKTE_UNENTSCHIEDEN;
        g.u++; g.punkte += PUNKTE_UNENTSCHIEDEN;
      }

      // Einzelspieler auswerten
      if (Array.isArray(m.spieler)) {
        m.spieler.forEach(sp => {
          const key = sp.pass ? `${sp.name}_${sp.pass}` : `${sp.name}_${sp.team}`;
          if (!players[key]) {
            players[key] = {
              name: sp.name,
              team: sp.team,
              einsaetze: 0,
              checks: 0,
              assists: 0,
              punkte: 0
            };
          }
          players[key].einsaetze += sp.playedMatch || 0;
          players[key].checks += sp.checks || 0;
          players[key].assists += sp.assists || 0;
          players[key].punkte += sp.points || 0;
        });
      }
    });

    // 1. Mannschaftstabelle sortieren (Punkte -> Leg-Differenz -> Gewonnene Legs)
    const sortedTeams = Object.values(teams).sort((a, b) => {
      if (b.punkte !== a.punkte) return b.punkte - a.punkte;
      const diffA = a.legsPlus - a.legsMinus;
      const diffB = b.legsPlus - b.legsMinus;
      if (diffB !== diffA) return diffB - diffA;
      return b.legsPlus - a.legsPlus;
    });

    const teamBody = document.getElementById("team_table_body");
    teamBody.innerHTML = sortedTeams.length === 0 
      ? `<tr><td colspan="9" style="color:#888; padding:15px;">Noch keine Spiele in dieser Liga erfasst.</td></tr>`
      : sortedTeams.map((t, idx) => {
          const diff = t.legsPlus - t.legsMinus;
          const diffStr = diff > 0 ? `+${diff}` : `${diff}`;
          return `
            <tr class="${idx === 0 ? 'rank-1' : ''}">
              <td><b>${idx + 1}.</b></td>
              <td class="left"><b>${t.name}</b></td>
              <td>${t.spiele}</td>
              <td>${t.s}</td>
              <td>${t.u}</td>
              <td>${t.n}</td>
              <td>${t.legsPlus} : ${t.legsMinus}</td>
              <td>${diffStr}</td>
              <td class="points-highlight">${t.punkte}</td>
            </tr>
          `;
        }).join("");

    // 2. Einzelrangliste sortieren (Gesamtpunkte -> Checks -> Assists)
    const sortedPlayers = Object.values(players).sort((a, b) => {
      if (b.punkte !== a.punkte) return b.punkte - a.punkte;
      if (b.checks !== a.checks) return b.checks - a.checks;
      return b.assists - a.assists;
    });

    const playerBody = document.getElementById("player_table_body");
    playerBody.innerHTML = sortedPlayers.length === 0
      ? `<tr><td colspan="7" style="color:#888; padding:15px;">Noch keine Spielerdaten vorhanden.</td></tr>`
      : sortedPlayers.map((p, idx) => `
          <tr class="${idx < 3 ? 'rank-1' : ''}">
            <td><b>${idx + 1}.</b></td>
            <td class="left"><b>${p.name}</b></td>
            <td class="left" style="color:#ccc;">${p.team}</td>
            <td>${p.einsaetze}</td>
            <td>${p.checks}</td>
            <td>${p.assists}</td>
            <td class="points-highlight">${p.punkte}</td>
          </tr>
        `).join("");
  }

  document.addEventListener("DOMContentLoaded", ladeAlleErgebnisse);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSH Liga – Papierbericht nachtragen</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 15px; }
    .container { max-width: 850px; margin: 0 auto; background: #2a2a2a; border: 2px solid #ffcc00; border-radius: 8px; padding: 20px; }
    h1, h3 { color: #ffcc00; text-align: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .panel { background: #333; padding: 12px; border-radius: 6px; border: 1px solid #444; }
    label { display: block; font-size: 12px; color: #ccc; margin: 6px 0 3px; }
    select, input { width: 100%; padding: 8px; background: #222; border: 1px solid #555; color: #fff; border-radius: 4px; box-sizing: border-box; }
    .player-row { display: grid; grid-template-columns: 3fr 1fr 1fr; gap: 6px; margin-bottom: 6px; align-items: center; }
    .btn-save { background: #00cc66; color: #000; font-weight: bold; border: none; padding: 14px; width: 100%; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
    .btn-save:hover { background: #00e673; }
  </style>
</head>
<body>
<div class="container">
  <h1>📝 Papier-Spielbericht nachtragen</h1>

  <div class="panel" style="margin-bottom: 15px;">
    <div class="grid-2">
      <div>
        <label>Liga / Gruppe:</label>
        <select id="liga">
          <option value="Gruppe A">A-Liga</option>
          <option value="Gruppe B">B-Liga</option>
          <option value="Gruppe C">C-Liga</option>
        </select>
      </div>
      <div>
        <label>Spieltag:</label>
        <select id="spieltag"></select>
      </div>
    </div>
    <label>Datum:</label>
    <input type="text" id="datum" placeholder="z.B. 13.11.2026">
  </div>

  <div class="grid-2">
    <!-- HEIMTEAM -->
    <div class="panel">
      <h3>🏠 Heimteam</h3>
      <select id="team_H" onchange="fuelleSpieler('H')"></select>
      <label>Endergebnis Legs Heim:</label>
      <input type="number" id="legs_H" value="0" min="0" max="32">
      <div style="display:grid; grid-template-columns: 3fr 1fr 1fr; gap:6px; font-size:11px; color:#ffcc00; margin-top:10px; text-align:center;">
        <span style="text-align:left;">Spieler</span><span>Check</span><span>Assist</span>
      </div>
      <div id="players_H"></div>
    </div>

    <!-- GASTTEAM -->
    <div class="panel">
      <h3>🚀 Gastteam</h3>
      <select id="team_G" onchange="fuelleSpieler('G')"></select>
      <label>Endergebnis Legs Gast:</label>
      <input type="number" id="legs_G" value="0" min="0" max="32">
      <div style="display:grid; grid-template-columns: 3fr 1fr 1fr; gap:6px; font-size:11px; color:#ffcc00; margin-top:10px; text-align:center;">
        <span style="text-align:left;">Spieler</span><span>Check</span><span>Assist</span>
      </div>
      <div id="players_G"></div>
    </div>
  </div>

  <button class="btn-save" onclick="generiereNachtragJSON()">💾 JSON-Datei für GitHub erstellen</button>
</div>

<script>
  let teamsData = {};

  // Spieltage 1 bis 30 füllen
  const stSel = document.getElementById("spieltag");
  for (let i = 1; i <= 30; i++) {
    stSel.innerHTML += `<option value="${i}. Spieltag">${i}. Spieltag</option>`;
  }

  // Je 8 Spielerzeilen für Heim und Gast erzeugen
  ['H', 'G'].forEach(side => {
    const box = document.getElementById("players_" + side);
    for (let i = 1; i <= 8; i++) {
      box.innerHTML += `
        <div class="player-row">
          <select id="p_${side}_${i}"><option value="">-- kein Spieler --</option></select>
          <input type="number" id="c_${side}_${i}" value="0" min="0" title="Checks">
          <input type="number" id="a_${side}_${i}" value="0" min="0" title="Assists">
        </div>`;
    }
  });

  // Spielerliste direkt aus deiner spieler.txt laden
  fetch("spieler.txt?v=" + Date.now())
    .then(r => r.text())
    .then(text => {
      text.split("\n").forEach(line => {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.includes(",")) return;
        let parts = trimmed.split(",").map(s => s.trim());
        if (parts.length < 2) return;
        const team = parts[0];
        let pass = "";
        if (parts.length >= 3 && (!isNaN(parts[parts.length - 1]) || parts[parts.length - 1] === "")) {
          pass = parts.pop();
        }
        while (parts.length > 2 && parts[parts.length - 1] === "") parts.pop();
        const nachname = parts[1] || "";
        const vorname = parts.length > 2 ? parts.slice(2).join(" ") : "";
        const fullName = vorname ? `${vorname} ${nachname}` : nachname;
        if (!teamsData[team]) teamsData[team] = [];
        teamsData[team].push({ name: fullName, pass: pass });
      });

      const tH = document.getElementById("team_H");
      const tG = document.getElementById("team_G");
      tH.innerHTML = '<option value="">-- Heimteam wählen --</option>';
      tG.innerHTML = '<option value="">-- Gastteam wählen --</option>';
      Object.keys(teamsData).forEach(t => {
        tH.innerHTML += `<option value="${t}">${t}</option>`;
        tG.innerHTML += `<option value="${t}">${t}</option>`;
      });
    });

  function fuelleSpieler(side) {
    const team = document.getElementById("team_" + side).value;
    const list = teamsData[team] || [];
    for (let i = 1; i <= 8; i++) {
      const sel = document.getElementById(`p_${side}_${i}`);
      sel.innerHTML = '<option value="">-- kein Spieler --</option>';
      list.forEach(p => {
        sel.innerHTML += `<option value="${p.name}" data-pass="${p.pass}">${p.name}</option>`;
      });
    }
  }

  function generiereNachtragJSON() {
    const liga = document.getElementById("liga").value;
    const spieltag = document.getElementById("spieltag").value;
    const datum = document.getElementById("datum").value.trim();
    const teamH = document.getElementById("team_H").value;
    const teamG = document.getElementById("team_G").value;
    const legsH = parseInt(document.getElementById("legs_H").value) || 0;
    const legsG = parseInt(document.getElementById("legs_G").value) || 0;

    if (!teamH || !teamG) { alert("Bitte Heim- und Gastteam auswählen!"); return; }

    const spielerStats = [];
    ['H', 'G'].forEach(side => {
      const tName = side === 'H' ? teamH : teamG;
      for (let i = 1; i <= 8; i++) {
        const sel = document.getElementById(`p_${side}_${i}`);
        const name = sel.value;
        if (name) {
          const pass = sel.options[sel.selectedIndex]?.getAttribute("data-pass") || "";
          const checks = parseInt(document.getElementById(`c_${side}_${i}`).value) || 0;
          const assists = parseInt(document.getElementById(`a_${side}_${i}`).value) || 0;
          spielerStats.push({
            team: tName,
            name: name,
            pass: pass,
            playedMatch: 1,
            checks: checks,
            assists: assists,
            points: (checks * 2) + assists
          });
        }
      }
    });

    const exportObj = {
      liga: liga,
      spieltag: spieltag,
      datum: datum,
      heimTeam: teamH,
      gastTeam: teamG,
      legsHeim: legsH,
      legsGast: legsG,
      spieler: spielerStats
    };

    const tagNum = spieltag.replace(/\D/g, "").padStart(2, "0");
    const cleanName = `${liga.replace(/\s+/g, "")}_ST${tagNum}_${teamH}_vs_${teamG}.json`
      .replace(/[^a-zA-Z0-9_\-\.]/g, "_");

    const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = cleanName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
